<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="Helvetica,Arial,sans-serif">
  <rect width="860" height="560" fill="#0e1117"/>
  <text x="430" y="34" fill="#e6edf3" font-size="20" text-anchor="middle" font-weight="bold">The Delegated Cognition Stack — measured 2026-10-07</text>
  <!-- HUB -->
  <rect x="60" y="70" width="740" height="92" rx="10" fill="#1c2a3a" stroke="#58a6ff"/>
  <text x="80" y="98" fill="#58a6ff" font-size="15" font-weight="bold">HUB (persistent session, K chars)</text>
  <text x="80" y="122" fill="#8b949e" font-size="12">mandate · registry · constraints · escalation — every char re-paid each of T remaining turns</text>
  <text x="80" y="146" fill="#7ee787" font-size="12">measured: 17.3 MB lifetime log, 75.6% tool output · 2× traffic / 185× artifact asymmetry · admission α ∈ [0.09, 0.19]</text>
  <!-- DOWNWARD -->
  <line x1="240" y1="162" x2="240" y2="212" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="250" y="192" fill="#58a6ff" font-size="12">brief + needle (S chars, once)</text>
  <!-- UPWARD -->
  <line x1="600" y1="212" x2="600" y2="162" stroke="#7ee787" stroke-width="2" marker-end="url(#b)"/>
  <text x="510" y="192" fill="#7ee787" font-size="12">artifact + verdict (αS admitted)</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#58a6ff"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#7ee787"/></marker>
  </defs>
  <!-- WORKERS -->
  <rect x="60" y="218" width="740" height="128" rx="10" fill="#161b22" stroke="#7ee787"/>
  <text x="80" y="246" fill="#7ee787" font-size="15" font-weight="bold">WORKERS (ephemeral, free-lane)</text>
  <rect x="80" y="262" width="215" height="64" rx="6" fill="#21262d"/><text x="187" y="290" fill="#e6edf3" font-size="12" text-anchor="middle">drafting (24–43 s)</text><text x="187" y="310" fill="#8b949e" font-size="11" text-anchor="middle">2 msgs · p̂ 14/14</text>
  <rect x="315" y="262" width="215" height="64" rx="6" fill="#21262d"/><text x="422" y="290" fill="#e6edf3" font-size="12" text-anchor="middle">research sweeps (479–525 s)</text><text x="422" y="310" fill="#8b949e" font-size="11" text-anchor="middle">27–70 msgs internal tools</text>
  <rect x="550" y="262" width="230" height="64" rx="6" fill="#21262d"/><text x="665" y="290" fill="#e6edf3" font-size="12" text-anchor="middle">N=6 parallel wave (419 s)</text><text x="665" y="310" fill="#8b949e" font-size="11" text-anchor="middle">1 INC-001 contained</text>
  <!-- DOMINANCE -->
  <rect x="60" y="370" width="740" height="76" rx="10" fill="#1f1325" stroke="#bc8cff"/>
  <text x="430" y="400" fill="#bc8cff" font-size="16" text-anchor="middle" font-family="Georgia,serif" font-style="italic">(w/h) &lt; p·(1+T)·(1−α)</text>
  <text x="430" y="428" fill="#8b949e" font-size="12" text-anchor="middle">delegation dominates · free lane w/h=0 cannot lose · 1/α ≈ 5.9–11× session-yield multiplier · verification = binding factor</text>
  <!-- SCARCITY -->
  <rect x="60" y="470" width="740" height="60" rx="10" fill="#251a12" stroke="#f0883e"/>
  <text x="430" y="496" fill="#f0883e" font-size="13" text-anchor="middle" font-weight="bold">Jevons binding: dispatch volume explodes → verification bandwidth K/αS is the scarce factor</text>
  <text x="430" y="516" fill="#8b949e" font-size="11" text-anchor="middle">⇒ mandate / registry / constraint / escalation are the cost-optimal control law (Part IV) — INC-001 absorbed by design</text>
</svg>